[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-capacity-planner"
version = "0.1.0"
description = "Transparent roofline-based LLM inference capacity planner"
requires-python = ">=3.10"
authors = [{name = "amadama"}]
license = {text = "MIT"}

[project.scripts]
llm-capacity-planner = "llm_capacity_planner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
